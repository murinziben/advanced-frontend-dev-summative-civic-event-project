<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promos · CivicEvents</title>
  <link rel="icon" type="image/png" href="./assets/images/favicon.png" />
  <meta name="description" content="Promos – CivicEvents, City of Kigali." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind.config.js"></script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<!-- Role guard: signed-in users only (js/core/guards.js). -->
<body data-root="./" data-guard="auth" data-page="promos" class="flex min-h-screen flex-col bg-background">
  <div id="site-header"></div>

  <main id="main" tabindex="-1" class="mx-auto w-full max-w-7xl flex-1 px-4 py-10 sm:px-6 lg:px-8">
      <header class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-navy sm:text-3xl">Promos</h1>
          <p class="mt-2 text-muted-foreground">Short city videos. Every video includes closed captions.</p>
        </div>
        <a href="admin/promo-form.html" data-show-for="admin" class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground shadow-sm transition hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-70">+ New promo</a>
      </header>
      <div class="mt-8 max-w-md">
        <label for="search" class="sr-only">Search promos</label>
        <input id="search" type="search" placeholder="Search videos…" class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" />
      </div>
      <div id="promos-list" class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Order matters: each script depends on the ones above it. -->
  <script src="./js/config.js"></script>
  <script src="./js/core/utils.js"></script>
  <script src="./js/core/auth.js"></script>
  <script src="./js/core/api.js"></script>
  <script src="./js/core/ui.js"></script>
  <script src="./js/core/guards.js"></script>
  <script src="./js/core/cache.js"></script>
  <script src="./js/core/notify-store.js"></script>
  <script src="./js/core/layout.js"></script>
  <script src="./js/core/app.js"></script>
  <script src="./js/components/cards.js"></script>
  <script src="./js/pages/promos.js"></script>
</body>
</html>
