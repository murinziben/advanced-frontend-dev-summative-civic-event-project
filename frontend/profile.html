<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My profile · CivicEvents</title>
  <link rel="icon" type="image/png" href="./assets/images/favicon.png" />
  <meta name="description" content="My profile – CivicEvents, City of Kigali." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind.config.js"></script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<!-- Role guard: signed-in users only (js/core/guards.js). -->
<body data-root="./" data-guard="auth" data-page="profile" class="flex min-h-screen flex-col bg-background">
  <div id="site-header"></div>

  <main id="main" tabindex="-1" class="mx-auto w-full max-w-5xl flex-1 px-4 py-10 sm:px-6 lg:px-8">
      <header class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-navy sm:text-3xl">My profile</h1>
          <p class="mt-2 text-muted-foreground">Check your details and keep your name and email up to date.</p>
        </div>
        
      </header>
      <div class="mt-8 grid gap-6 lg:grid-cols-[20rem_1fr]">
        <section aria-label="Account summary" class="rounded-xl border border-border bg-card shadow-card p-6">
          <div id="profile-summary"></div>
        </section>
        <section aria-labelledby="edit-title" class="rounded-xl border border-border bg-card shadow-card p-6">
          <h2 id="edit-title" class="text-lg font-bold">Edit details</h2>
          <form id="profile-form" class="mt-5 space-y-5" novalidate>
            <div data-form-alert class="hidden"></div>
            <div>
              <label for="full_name" class="mb-1.5 block text-sm font-semibold">Full name <span class="text-destructive" aria-hidden="true">*</span></label>
              <input id="full_name" type="text" autocomplete="name" maxlength="255" required class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" />
            </div>
            <div>
              <label for="email" class="mb-1.5 block text-sm font-semibold">Email address <span class="text-destructive" aria-hidden="true">*</span></label>
              <input id="email" type="email" autocomplete="email" maxlength="255" required class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" aria-describedby="email-hint" />
              <p id="email-hint" class="mt-1.5 text-xs text-muted-foreground">You use this email to sign in.</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button id="profile-submit" type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground shadow-sm transition hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-70">Save changes</button>
              <button id="reset-profile" type="button" class="inline-flex items-center justify-center gap-2 rounded-lg border border-input bg-card px-4 py-2.5 text-sm font-semibold transition hover:bg-muted">Undo changes</button>
            </div>
          </form>
        </section>
      </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Order matters: each script depends on the ones above it. -->
  <script src="./js/config.js"></script>
  <script src="./js/core/utils.js"></script>
  <script src="./js/core/auth.js"></script>
  <script src="./js/core/api.js"></script>
  <script src="./js/core/ui.js"></script>
  <script src="./js/core/guards.js"></script>
  <script src="./js/core/cache.js"></script>
  <script src="./js/core/notify-store.js"></script>
  <script src="./js/core/layout.js"></script>
  <script src="./js/core/app.js"></script>
  <script src="./js/pages/profile.js"></script>
</body>
</html>
