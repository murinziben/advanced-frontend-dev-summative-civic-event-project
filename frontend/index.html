<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City events &amp; services · CivicEvents</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <meta name="description" content="CivicEvents – the official portal for events, announcements and community life in the City of Greenhill." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-root="./" data-guard="public" data-page="home" class="flex min-h-screen flex-col bg-background">
  <div id="site-header"></div>

  <main id="main" tabindex="-1">
    <section class="hero-photo relative" aria-labelledby="hero-title">
      <div id="hero-slides" class="absolute inset-0"></div>
      <div class="relative z-10 mx-auto max-w-7xl px-4 pb-28 pt-20 sm:px-6 lg:px-8 lg:pb-36 lg:pt-28">
        <p class="text-xs font-bold uppercase tracking-[0.18em] text-sky-300">City of Greenhill</p>
        <h1 id="hero-title" class="mt-4 max-w-2xl text-4xl font-extrabold leading-[1.1] tracking-tight text-white sm:text-5xl lg:text-6xl">
          Your city, your community, all in one place.
        </h1>
        <p class="mt-5 max-w-xl text-base text-white/90 sm:text-lg">
          Find events near you, hear the latest announcements and register in seconds.
        </p>

        <form role="search" action="events.html" method="get"
          class="mt-8 flex max-w-xl flex-col gap-2 rounded-xl bg-card p-2 shadow-lift sm:flex-row">
          <label for="hero-search" class="sr-only">Search events</label>
          <div class="relative flex-1">
            <span id="hero-search-icon" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"></span>
            <input id="hero-search" name="q" type="search" placeholder="Search festivals, workshops, town halls…"
              class="w-full rounded-lg border-0 bg-transparent py-3 pl-10 pr-3 text-sm placeholder:text-muted-foreground" />
          </div>
          <button type="submit" class="rounded-lg bg-primary px-5 py-3 text-sm font-bold text-primary-foreground transition hover:bg-primary/90">
            Find events
          </button>
        </form>
      </div>
    </section>

    <section aria-label="What you can do" class="relative z-10 mx-auto -mt-14 max-w-7xl px-4 sm:px-6 lg:px-8">
      <div id="feature-cards" class="grid gap-4 md:grid-cols-3"></div>
    </section>

    <section class="mx-auto max-w-7xl px-4 pt-16 sm:px-6 lg:px-8" aria-labelledby="featured-title">
      <div class="flex items-end justify-between gap-4">
        <div>
          <h2 id="featured-title" class="text-2xl font-extrabold tracking-tight sm:text-3xl">Upcoming events</h2>
          <p class="mt-1 text-sm text-muted-foreground">The next events happening across the city.</p>
        </div>
        <a href="events.html" class="hidden shrink-0 items-center gap-1 text-sm font-semibold text-primary hover:underline sm:inline-flex">All events <span aria-hidden="true">→</span></a>
      </div>
      <div id="featured-events" class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></div>
    </section>

    <section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8" aria-labelledby="announcements-title">
      <div class="flex items-end justify-between gap-4">
        <h2 id="announcements-title" class="text-2xl font-extrabold tracking-tight sm:text-3xl">Latest announcements</h2>
        <a href="announcements.html" class="hidden shrink-0 items-center gap-1 text-sm font-semibold text-primary hover:underline sm:inline-flex">All announcements <span aria-hidden="true">→</span></a>
      </div>
      <div id="latest-announcements" class="mt-6 grid gap-4 md:grid-cols-2" aria-live="polite"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Order matters: each script depends on the ones above it. -->
  <script src="js/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/guards.js"></script>
  <script src="js/core/notify-store.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/app.js"></script>
  <script src="js/components/cards.js"></script>
  <script src="js/components/slideshow.js"></script>

  <script src="js/pages/home.js"></script>
</body>
</html>
