<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · CivicEvents</title>
  <meta name="description" content="Sign in to CivicEvents to register for city events and see your notifications." />

  <!-- Font: Plus Jakarta Sans (same as the design) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (Play CDN) + our design tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<!-- data-guard="guest": logged-in users are sent to their dashboard (see js/core/guards.js) -->
<body data-root="./" data-guard="guest" data-page="login" class="min-h-screen bg-background">
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="grid min-h-screen lg:grid-cols-2">
    <!-- Left: form -->
    <main id="main" class="flex items-center justify-center px-4 py-12 sm:px-8">
      <div class="w-full max-w-md">
        <div id="auth-logo" class="mb-8"></div>

        <h1 class="text-3xl font-extrabold tracking-tight">Welcome back</h1>
        <p class="mt-2 text-muted-foreground">Sign in to manage your events and notifications.</p>

        <form id="login-form" class="mt-8 space-y-5" novalidate>
          <!-- Errors that aren't about one field (e.g. wrong password) appear here -->
          <div data-form-alert class="hidden"></div>

          <div>
            <label for="email" class="mb-1.5 block text-sm font-semibold">
              Email address <span class="text-destructive" aria-hidden="true">*</span>
            </label>
            <input id="email" name="email" type="email" autocomplete="email" required
              class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" />
          </div>

          <div>
            <label for="password" class="mb-1.5 block text-sm font-semibold">
              Password <span class="text-destructive" aria-hidden="true">*</span>
            </label>
            <div class="relative" data-field>
              <input id="password" name="password" type="password" autocomplete="current-password" required
                class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 pr-11 text-sm focus:border-ring" />
              <button type="button" data-toggle-password="password"
                class="absolute right-1.5 top-1/2 -translate-y-1/2 rounded-md p-1.5 text-muted-foreground hover:text-foreground"
                aria-label="Show password" aria-pressed="false"></button>
            </div>
          </div>

          <div class="flex items-center justify-between gap-3">
            <label class="flex items-center gap-2 text-sm text-muted-foreground">
              <input id="remember" type="checkbox" class="h-4 w-4 rounded border-input accent-primary" />
              Remember me on this device
            </label>
          </div>

          <button id="login-submit" type="submit"
            class="w-full rounded-lg bg-primary px-4 py-3 text-sm font-semibold text-primary-foreground shadow-sm transition hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-70">
            Sign in
          </button>

          <p class="text-center text-sm text-muted-foreground">
            New to CivicEvents?
            <a href="signup.html" class="font-semibold text-primary hover:underline">Create an account</a>
          </p>
        </form>
      </div>
    </main>

    <!-- Right: photo panel (decorative, hidden on small screens) -->
    <aside class="auth-photo relative hidden lg:block" aria-hidden="true">
      <div class="absolute inset-x-0 bottom-0 p-12 text-white">
        <p class="text-2xl font-bold leading-snug">“Over 18,000 residents joined a city event this year.”</p>
        <p class="mt-3 text-sm font-semibold text-white/80">— Greenhill Community Office</p>
      </div>
    </aside>
  </div>

  <!-- Libraries -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Core (order matters) -->
  <script src="js/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/guards.js"></script>
  <script src="js/core/notify-store.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/app.js"></script>

  <!-- Page -->
  <script src="js/pages/auth-shared.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
