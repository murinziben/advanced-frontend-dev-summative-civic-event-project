<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access denied · CivicEvents</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<!-- Shown when a normal user opens an admin page (403 Forbidden). -->
<body data-root="./" data-guard="public" data-page="forbidden" class="flex min-h-screen flex-col bg-background">
  <div id="site-header"></div>

  <main id="main" tabindex="-1" class="flex flex-1 items-center justify-center px-4 py-20">
    <div class="max-w-md text-center">
      <p class="text-7xl font-extrabold tracking-tight text-primary">403</p>
      <h1 class="mt-4 text-2xl font-bold">You don't have access to this page</h1>
      <p class="mt-3 text-muted-foreground">
        This area is for city administrators only. If you think you should have access,
        please contact the CivicEvents team at
        <a id="contact-email" class="font-semibold text-primary hover:underline" href="#"></a>.
      </p>
      <div class="mt-8 flex flex-wrap justify-center gap-3">
        <a href="index.html" class="rounded-lg bg-primary px-5 py-2.5 text-sm font-semibold text-primary-foreground hover:bg-primary/90">Go home</a>
        <a href="events.html" class="rounded-lg border border-input bg-card px-5 py-2.5 text-sm font-semibold hover:bg-muted">Browse events</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/guards.js"></script>
  <script src="js/core/notify-store.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/app.js"></script>
  <script>
    CivicApp.start(function () {
      var email = CivicConfig.CONTACT.email;
      $("#contact-email").text(email).attr("href", "mailto:" + email);
    });
  </script>
</body>
</html>
