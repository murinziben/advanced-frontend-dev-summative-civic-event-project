<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event form · CivicEvents</title>
  <meta name="description" content="Event form – CivicEvents, City of Greenhill." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<!-- ADMIN PAGE GUARD: data-guard="admin" → visitors go to login, normal users to forbidden.html (js/core/guards.js).
     The server ALSO checks every admin request with authorize(['admin']). -->
<body data-root="../" data-guard="admin" data-page="admin" data-admin-page="events" class="flex min-h-screen flex-col bg-background">
  <div id="site-header"></div>

  <div class="mx-auto flex w-full max-w-7xl flex-1 gap-8 px-4 py-8 sm:px-6 lg:px-8">
    <aside id="admin-sidebar" class="hidden w-60 shrink-0 lg:block"></aside>
    <main id="main" tabindex="-1" class="min-w-0 flex-1">
      <div id="admin-mobile-nav" class="mb-6 lg:hidden"></div>
      <a href="events.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-primary hover:underline"><span aria-hidden="true">←</span> Back to events</a>
      <div class="mt-4">
        <h1 id="form-title" class="text-3xl font-extrabold tracking-tight">Create event</h1>
        <p id="form-intro" class="mt-2 text-muted-foreground"></p>
      </div>
      <form id="event-form" class="mt-8 max-w-3xl space-y-6 rounded-xl border border-border bg-card shadow-card p-6" novalidate>
        <div data-form-alert class="hidden"></div>
        <div>
          <label for="title" class="mb-1.5 block text-sm font-semibold">Title <span class="text-destructive" aria-hidden="true">*</span></label>
          <input id="title" type="text" maxlength="200" required class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" />
        </div>
        <div>
          <label for="description" class="mb-1.5 block text-sm font-semibold">Description</label>
          <textarea id="description" rows="5" maxlength="3000" class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" placeholder="What will happen, who it's for, accessibility details…"></textarea>
        </div>
        <div>
          <label for="location" class="mb-1.5 block text-sm font-semibold">Location <span class="text-destructive" aria-hidden="true">*</span></label>
          <input id="location" type="text" maxlength="200" required placeholder="e.g. Riverside Park Amphitheatre" class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" />
        </div>
        <div class="grid gap-6 sm:grid-cols-2">
          <div>
            <label for="starts_at" class="mb-1.5 block text-sm font-semibold">Starts <span class="text-destructive" aria-hidden="true">*</span></label>
            <input id="starts_at" type="datetime-local" required class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" />
          </div>
          <div>
            <label for="ends_at" class="mb-1.5 block text-sm font-semibold">Ends <span class="text-destructive" aria-hidden="true">*</span></label>
            <input id="ends_at" type="datetime-local" required class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" />
          </div>
        </div>
        <div>
          <label for="image" class="mb-1.5 block text-sm font-semibold">Event image</label>
          <input id="image" type="file" class="block w-full text-sm file:mr-4 file:rounded-lg file:border-0 file:bg-primary-soft file:px-4 file:py-2.5 file:text-sm file:font-semibold file:text-primary hover:file:bg-primary-soft/70" />
          <div id="image-preview" class="mt-3" aria-live="polite"></div>
        </div>
        <p class="rounded-lg bg-muted p-3 text-xs text-muted-foreground">Events go live for residents straight away and everyone receives a notification. (The provided backend doesn't support saving events as drafts.)</p>
        <div class="flex flex-wrap gap-2 border-t border-border pt-6">
          <button id="event-submit" type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground shadow-sm transition hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-70">Create event</button>
          <a href="events.html" class="inline-flex items-center justify-center gap-2 rounded-lg border border-input bg-card px-4 py-2.5 text-sm font-semibold transition hover:bg-muted">Cancel</a>
          <a id="view-link" href="#" class="inline-flex items-center justify-center gap-2 rounded-lg border border-input bg-card px-4 py-2.5 text-sm font-semibold transition hover:bg-muted hidden">View public page</a>
        </div>
      </form>
    </main>
  </div>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Core -->
  <script src="../js/config.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/guards.js"></script>
  <script src="../js/core/cache.js"></script>
  <script src="../js/core/notify-store.js"></script>
  <script src="../js/core/layout.js"></script>
  <script src="../js/core/app.js"></script>

  <!-- Components -->
  <script src="../js/components/cards.js"></script>
  <script src="../js/components/admin-layout.js"></script>
  <script src="../js/components/file-field.js"></script>

  <!-- Page -->
  <script src="../js/pages/admin-event-form.js"></script>
</body>
</html>
