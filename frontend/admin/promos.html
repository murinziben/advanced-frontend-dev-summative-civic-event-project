<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage promos · CivicEvents</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
  <meta name="description" content="Manage promos – CivicEvents, City of Kigali." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<!-- Role guard: admins only (js/core/guards.js); the API also enforces authorize(['admin']). -->
<body data-root="../" data-guard="admin" data-page="admin" data-admin-page="promos" data-resource="promos" class="min-h-screen bg-background">
  <aside id="admin-sidebar" class="admin-sidebar fixed inset-y-0 left-0 z-40 -translate-x-full border-r border-border bg-card lg:translate-x-0" aria-label="Admin navigation"></aside>
  <div class="admin-content flex min-h-screen flex-col">
    <div id="site-header"></div>

    <main id="main" tabindex="-1" class="w-full flex-1 px-4 py-6 sm:px-6 lg:px-8">
      <header class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-navy sm:text-3xl">Promos</h1>
          <p class="mt-2 text-muted-foreground">Upload captioned promo videos, publish or hide them, and remove old ones.</p>
        </div>
        <a href="promo-form.html" class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground shadow-sm transition hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-70">+ New promo</a>
      </header>
      <div class="mt-6 flex flex-wrap items-end gap-4 rounded-xl border border-border bg-card shadow-card p-4">
          <div class="min-w-[14rem] flex-1">
            <label for="search" class="mb-1.5 block text-sm font-semibold">Search</label>
            <input id="search" type="search" placeholder="Title…" class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring" />
          </div><div>
            <label for="status" class="mb-1.5 block text-sm font-semibold">Status</label>
            <select id="status" class="w-full rounded-lg border border-input bg-card px-3.5 py-2.5 text-sm focus:border-ring pr-8"><option value="">All</option><option value="published">Published</option><option value="unpublished">Unpublished</option></select>
          </div>
      </div>
      <p id="content-count" class="mt-6 text-sm text-muted-foreground" aria-live="polite"></p>
      <div class="mt-3 overflow-x-auto rounded-xl border border-border bg-card shadow-card">
        <table class="w-full min-w-[40rem] text-left text-sm">
          <caption class="sr-only">All promos</caption>
          <thead class="border-b border-border bg-muted/60 text-xs uppercase tracking-wide text-muted-foreground"><tr><th scope="col" class="px-4 py-3">Title</th><th scope="col" class="px-4 py-3">Created</th><th scope="col" class="px-4 py-3">Published</th><th scope="col" class="px-4 py-3"><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="content-body"></tbody>
        </table>
      </div>
      <div id="content-pagination" class="mt-6"></div>
    </main>
    <footer class="px-4 py-5 text-xs text-muted-foreground sm:px-6 lg:px-8">© City of Kigali · CivicEvents administration</footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Order matters: each script depends on the ones above it. -->
  <script src="../js/config.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/guards.js"></script>
  <script src="../js/core/cache.js"></script>
  <script src="../js/core/notify-store.js"></script>
  <script src="../js/core/layout.js"></script>
  <script src="../js/core/app.js"></script>
  <script src="../js/components/admin-layout.js"></script>
  <script src="../js/components/pagination.js"></script>
  <script src="../js/pages/admin-content.js"></script>
</body>
</html>
